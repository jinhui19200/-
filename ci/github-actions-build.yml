# ──────────────────────────────────────────────────────────────────────
#  安装说明（这段不要粘贴 —— 粘贴请从下面的 `name: Build` 开始）
#
#  ⚠️ 推送 `.github/workflows/` 下的文件，需要 token 具备 `workflow` scope。
#     本机凭据实测只有 `gist, read:org, repo`，缺这一项，GitHub 会**直接拒收整个 push**。
#     所以这个文件当前待在 ci/ 下，两条安装路径：
#
#    A. 网页（推荐：不碰凭据，一分钟）
#       打开 https://github.com/jinhui19200/-/new/main?filename=.github/workflows/build.yml
#       把 `name: Build` 往下全部内容粘进去，提交。
#
#    B. 补 scope 后从命令行装
#       gh 装着但不在 PATH 上，用全路径：
#         GH="/Users/hui/Documents/New project/.tools/gh/gh_2.94.0_macOS_arm64/bin/gh"
#         "$GH" auth refresh -s workflow
#         mkdir -p .github/workflows
#         git mv ci/github-actions-build.yml .github/workflows/build.yml
#         git commit -m "装 CI 工作流" && git push
#
#  装好之后两处内容应保持一致，改一处记得同步另一处。
#
#  想查当前凭据有哪些 scope（不用 gh）：
#    TOKEN=$(printf 'protocol=https\nhost=github.com\n\n' | git credential fill | sed -n 's/^password=//p')
#    curl -sI -H "Authorization: token $TOKEN" https://api.github.com/user | grep -i x-oauth-scopes
# ──────────────────────────────────────────────────────────────────────

name: Build

# 触发方式：推 tag 即打包，例如  git tag v1.2.1 && git push origin v1.2.1
#          产物在 Actions 页面该次运行的 Artifacts 里下载。
# 签名情况：macOS 与 Windows 的安装包都未做代码签名，用户首次打开会被系统拦截
#          （macOS 在「隐私与安全性」里放行，Windows 在 SmartScreen 里选「仍要运行」）。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # 先跑类型检查与三层自检，全过才允许打包。
  #
  # 未纳入 CI 的两层（都是有意为之，别当成遗漏）：
  #   verify:packaged  需要先有挂载好的 DMG 或 dist/mac* 的 .app，
  #                    而且它验的正是「本机刚打出来的那个包」—— 放进 CI 没有意义。
  #   verify:app       需要真实窗口，见下方注释。
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run verify:store
      # 界面自检：真实 Chromium 里量布局几何 + 跑交互 + 导出往返（151 项）
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:ui
      # 端到端自检（真实 Electron + IPC + 磁盘，59 项）与
      # 真应用自检（真实入口 + 真实窗口 + CDP，40 项）—— 默认不开：
      # 它们需要能起 Electron 窗口的环境（隐藏窗口也需要），ubuntu 上要先装 xvfb。
      # 想让它进 CI，把下面两行取消注释即可（首次跑建议先手动确认通过）：
      #
      # - run: sudo apt-get update && sudo apt-get install -y xvfb
      # - run: xvfb-run -a npm run verify:electron && xvfb-run -a npm run verify:app

  build-mac:
    runs-on: macos-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: dist/*.dmg
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: dist/*.exe
          if-no-files-found: error

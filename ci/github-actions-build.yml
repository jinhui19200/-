# ──────────────────────────────────────────────────────────────────────
#  状态：**已安装**（2026-09-20）—— 仓库里已有 `.github/workflows/build.yml`。
#        安装时漏了首行 `name: Build`（其余 76 行逐行一致）。YAML 里 `name` 是可选的，
#        不影响运行，只是 Actions 页面显示成文件名 `build.yml` 而不是 `Build`。
#
#  ⚠️ 以后改这个工作流，**别直接改 `.github/workflows/build.yml` 再推** ——
#     本机 token 只有 `gist, read:org, repo`，缺 `workflow` scope，GitHub 会拒收整个 push。
#     正确姿势是改 `ci/` 这份，然后二选一：
#       A. 网页编辑 .github/workflows/build.yml（把 `name:` 往下整份替换）
#       B. 先补 scope（gh 装着但不在 PATH 上，用全路径）：
#            GH="/Users/hui/Documents/New project/.tools/gh/gh_2.94.0_macOS_arm64/bin/gh"
#            "$GH" auth refresh -s workflow
#          补上之后就能直接改 `.github/workflows/build.yml` 了，这份 ci/ 副本即可删除。
#
#  注意区分：仓库里**存在** workflow 文件，并不妨碍其他文件的推送 ——
#    只要这次 push 的提交没有改动 `.github/workflows/` 下的内容，`repo` scope 就够。
#
#  查当前凭据有哪些 scope（不用 gh）：
#    TOKEN=$(printf 'protocol=https\nhost=github.com\n\n' | git credential fill | sed -n 's/^password=//p')
#    curl -sI -H "Authorization: token $TOKEN" https://api.github.com/user | grep -i x-oauth-scopes
#
#  ⚠️ 为什么 `build:mac` / `build:win` 里带了 `--publish never`：
#     electron-builder 检测到「在 tag 上跑」会**自动去发 GitHub Release**，
#     没有 GH_TOKEN 就报错退出 —— 而那时安装包其实已经打好了，纯粹白挂。
#     实测（run #3 / v1.2.0）：两个 DMG 与 exe **都成功产出**，最后倒在
#       ⨯ GitHub Personal Access Token is not set, neither programmatically, nor using env "GH_TOKEN"
#     所以把「构建」和「发布」拆开：构建永不发布；要发 Release 就单独加一步。
#
#  可选升级 —— 让 tag 构建顺带发 Release（要改工作流，改完仍走网页粘贴）：
#     1) 文件顶部（`on:` 之前）加：
#          permissions:
#            contents: write
#     2) build-mac / build-win 的 upload-artifact 之后各加一步：
#          - name: 发 Release
#            env:
#              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#            run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*.dmg
#        （Windows 那份把 dist/*.dmg 换成 dist/*.exe）
#     注意：这样发 Release 靠的是工作流里的 gh，**不是** electron-builder 的隐式发布，
#     所以 package.json 里的 `--publish never` 要保留。
# ──────────────────────────────────────────────────────────────────────

name: Build

# 触发方式：推 tag 即打包，例如  git tag v1.2.1 && git push origin v1.2.1
#          产物在 Actions 页面该次运行的 Artifacts 里下载。
# 签名情况：macOS 与 Windows 的安装包都未做代码签名，用户首次打开会被系统拦截
#          （macOS 在「隐私与安全性」里放行，Windows 在 SmartScreen 里选「仍要运行」）。
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # 先跑类型检查与三层自检，全过才允许打包。
  #
  # 未纳入 CI 的两层（都是有意为之，别当成遗漏）：
  #   verify:packaged  需要先有挂载好的 DMG 或 dist/mac* 的 .app，
  #                    而且它验的正是「本机刚打出来的那个包」—— 放进 CI 没有意义。
  #   verify:app       需要真实窗口，见下方注释。
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run verify:store
      # 界面自检：真实 Chromium 里量布局几何 + 跑交互 + 导出往返（151 项）
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:ui
      # 端到端自检（真实 Electron + IPC + 磁盘，59 项）与
      # 真应用自检（真实入口 + 真实窗口 + CDP，40 项）—— 默认不开：
      # 它们需要能起 Electron 窗口的环境（隐藏窗口也需要），ubuntu 上要先装 xvfb。
      # 想让它进 CI，把下面两行取消注释即可（首次跑建议先手动确认通过）：
      #
      # - run: sudo apt-get update && sudo apt-get install -y xvfb
      # - run: xvfb-run -a npm run verify:electron && xvfb-run -a npm run verify:app

  build-mac:
    runs-on: macos-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: dist/*.dmg
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: dist/*.exe
          if-no-files-found: error

# GitHub Actions 工作流 —— 待安装
#
# 这个文件**就是要装进 .github/workflows/build.yml 的全部内容**，
# 从 `name:` 往下原样复制即可（上面这些注释也是 YAML 注释，一起复制没问题）。
#
# 为什么它现在待在 ci/ 而不是 .github/workflows/：
#   推送 `.github/workflows/` 下的文件需要 token 具备 `workflow` scope。
#   本机钥匙串里那个凭据实测只有 `gist, read:org, repo`（x-oauth-scopes 头），
#   缺 `workflow`，GitHub 会直接拒收整个 push。
#   ⇒ 没拿到 scope 之前，千万别把它 commit 进 .github/workflows/，
#     否则之后每一次 git push 都会失败。
#
# 安装方式（二选一）：
#
#   A. 网页上装（推荐：不碰凭据，一分钟）
#      1. 打开
#         https://github.com/jinhui19200/-/new/main?filename=.github/workflows/build.yml
#      2. 把本文件全部内容粘进去
#      3. 提交
#
#   B. 给凭据补权限后从命令行装
#      1. 本机目前没装 gh，先装： brew install gh
#      2. 终端执行： gh auth refresh -s workflow
#         （沙箱里做不了这一步：gh 写 macOS 钥匙串会被拒，实测过 6 种绕法全失败）
#      3. mkdir -p .github/workflows
#         git mv ci/github-actions-build.yml .github/workflows/build.yml
#         git commit -m "装 CI 工作流" && git push
#
# 触发方式：
#   推 tag 即打包，例如  git tag v1.2.1 && git push origin v1.2.1
#   打包产物在 Actions 页面该次运行的 Artifacts 里下载。
#
# 说明：macOS 与 Windows 的安装包都未做代码签名，
#   用户在系统里首次打开会被拦截（macOS 需在「隐私与安全性」里放行，
#   Windows 需在 SmartScreen 提示里选「仍要运行」）。
#
# 未纳入 CI 的两层（都是有意为之，别当成遗漏）：
#   verify:packaged  需要先有挂载好的 DMG 或 dist/mac* 的 .app，
#                    且它验的正是「本机打出来的那个包」——放进 CI 没有意义。
#   verify:app       需要真实窗口，见下方注释。

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # 先跑类型检查与三层自检，全过才允许打包
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run verify:store
      # 界面自检：真实 Chromium 里量布局几何 + 跑交互 + 导出往返（151 项）
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:ui
      # 端到端自检（真实 Electron + IPC + 磁盘，59 项）与
      # 真应用自检（真实入口 + 真实窗口 + CDP，40 项）—— 默认不开：
      # 它们需要能起 Electron 窗口的环境（隐藏窗口也需要），ubuntu 上要先装 xvfb。
      # 想让它进 CI，把下面两行取消注释即可（首次跑建议先手动确认通过）：
      #
      # - run: sudo apt-get update && sudo apt-get install -y xvfb
      # - run: xvfb-run -a npm run verify:electron && xvfb-run -a npm run verify:app

  build-mac:
    runs-on: macos-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: dist/*.dmg
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: dist/*.exe
          if-no-files-found: error

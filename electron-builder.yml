appId: com.jinhui.warehouse-manager
productName: 库存管理系统

directories:
  buildResources: build

# 打包内容用**白名单**，不是黑名单。
#
# 原先只写了几条排除项，等于「其余全收」。后果是三轮 release 都把开发期产物
# 打进了 app.asar：1.6MB 的验证截图（out/verify-ui/*.png、out/report-*.png）、
# 39KB 的内部工作笔记（.workbuddy-ai/memory/）、scripts/、preview/、ci/、
# 以及两个 *.command 启动脚本。装到用户机器上的包里有这些东西，纯属噪音。
#
# 黑名单的根本问题：它只能挡住已知的目录，以后新冒出来的开发目录会默认被打进去
# （这次就是这么漏的 —— 验证截图是后来才生成的，没人想到要补一条排除）。
# 白名单反过来，没列出来的一律不进，新增开发目录默认是安全的。
files:
  - package.json
  - out/main/**/*
  - out/preload/**/*
  - out/renderer/**/*
  - node_modules/**/*
  # xlsx 是渲染进程 import 的，会被 Vite 整个打进 out/renderer 的 bundle。
  # 已核实：渲染 bundle 里**零个 require()**，main / preload 也没引用它 ——
  # 也就是说 asar 里这份 node_modules/xlsx 是死重，占了 7MB 里的 5.9MB。
  # 之所以敢删，是因为有断言盯着 bundle 里确实带着 xlsx 的编码器（见 verify-ui）；
  # 哪天真把导出挪到主进程，那条断言会先变红，而不是打包后静默失效。
  - '!node_modules/xlsx/**/*'
  # xlsx 的 dist 里还带着 ~2MB 的 source map，运行期用不到
  - '!**/*.map'
  - '!**/{.DS_Store,Thumbs.db}'

mac:
  category: public.app-category.productivity
  # 本机没有 Developer ID 证书，用 ad-hoc（"-"）签名。
  # 不签的后果：arm64 包只有 Electron 自带的 linker 签名、bundle 无签名，
  # 别人从网上下载后会被 Gatekeeper 判为「已损坏，无法打开」（无法右键绕过）。
  # ad-hoc 签名后至少能走「右键 → 打开」放行。
  identity: '-'
  # 只出 arm64 一份。
  #
  # 原先同时出 arm64 + x64，实际交付里 x64 那份是纯负担：
  # 本机是 Apple Silicon，x64 包要跑 Rosetta 才能验证，而 verify:packaged
  # 在这种「被当作 Node 启动」的环境里还会因为 ELECTRON_RUN_AS_NODE 直接起不来，
  # 等于**每次都要多打一份自己验不了的包**。
  # 需要 Intel 版时把 x64 加回来即可，artifactName 里的 ${arch} 已经能区分。
  target:
    - target: dmg
      arch:
        - arm64
  artifactName: ${name}-${version}-${arch}.${ext}

win:
  executableName: warehouse-manager
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 库存管理系统
  artifactName: ${name}-${version}-setup.${ext}

npmRebuild: false

appId: com.jinhui.warehouse-manager
productName: 库存管理系统

directories:
  buildResources: build

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'

mac:
  category: public.app-category.productivity
  # 本机没有 Developer ID 证书，用 ad-hoc（"-"）签名。
  # 不签的后果：arm64 包只有 Electron 自带的 linker 签名、bundle 无签名，
  # 别人从网上下载后会被 Gatekeeper 判为「已损坏，无法打开」（无法右键绕过）。
  # ad-hoc 签名后至少能走「右键 → 打开」放行。
  identity: '-'
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  artifactName: ${name}-${version}-${arch}.${ext}

win:
  executableName: warehouse-manager
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 库存管理系统
  artifactName: ${name}-${version}-setup.${ext}

npmRebuild: false
